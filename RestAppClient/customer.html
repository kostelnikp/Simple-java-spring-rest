<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="customer.html">Customers</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="orders.html">Orders</a>
                <a class="nav-link" href="productOrders.html">Product-Orders</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Customer Management</h2>
    <hr>

    <div class="row">
        <div class="col-md-12">
            <div class="row">
                <h4 class="col-md-10">Customer List</h4>
                <button class="btn btn-sm btn-primary col-md-2" data-bs-toggle="modal"
                        data-bs-target="#addCustomerModal" onclick="clearModal()">Add Customer
                </button>
            </div>
            <table id="customerTable" class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Meno</th>
                    <th>Priezvisko</th>
                    <th>Email</th>
                    <th>Telefón</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="customerList">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addCustomerModal" tabindex="-1" aria-labelledby="addCustomerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addCustomerModalLabel">Add/Edit Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <div class="form-group">
                        <input type="hidden" id="customerId">
                        <label for="name">Name:</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="surname">Surname:</label>
                        <input type="text" class="form-control" id="surname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone:</label>
                        <input type="text" class="form-control" id="phone" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2" id="saveBtn">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
    function getAllCustomers() {
        fetch("http://localhost:9090/getAllCustomers")
            .then(response => response.json())
            .then(data => {
                const customerTable = document.getElementById("customerList");
                customerTable.innerHTML = "";
                data.forEach(customer => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${customer.id}</td>
                        <td>${customer.name}</td>
                        <td>${customer.surname}</td>
                        <td>${customer.email}</td>
                        <td>${customer.phone}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editCustomer(${customer.id})" data-bs-toggle="modal" data-bs-target="#addCustomerModal">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${customer.id})">Delete</button>
                        </td>
                    `;
                    customerTable.appendChild(row);
                });
            })
            .catch(error => {
                console.error("Error:", error);
                const customerTable = document.getElementById("customerList");
                customerTable.innerHTML = "<tr><td colspan='6'>No customers found.</td></tr>";
            });
    }

    function editCustomer(id) {
        fetch(`http://localhost:9090/getCustomerById/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("customerId").value = data.id;
                document.getElementById("name").value = data.name;
                document.getElementById("surname").value = data.surname;
                document.getElementById("email").value = data.email;
                document.getElementById("phone").value = data.phone;
            })
            .catch(error => console.error("Error:", error));
    }

    document.getElementById("customerForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const id = document.getElementById("customerId").value;
        const name = document.getElementById("name").value;
        const surname = document.getElementById("surname").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const customer = {id: id, name: name, surname: surname, email: email, phone: phone};

        fetch("http://localhost:9090/createCustomer", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(customer)
        })
            .then(() => {
                getAllCustomers();
                document.getElementById("customerId").value = '';
                document.getElementById("name").value = '';
                document.getElementById("surname").value = '';
                document.getElementById("email").value = '';
                document.getElementById("phone").value = '';
            })
            .catch(error => console.error("Error:", error));
    });

    function deleteCustomer(id) {
        fetch(`http://localhost:9090/deleteCustomerById/${id}`, {
            method: "DELETE"
        })
            .then(() => {
                console.log("Customer deleted successfully!");
                getAllCustomers();
            })
            .catch(error => console.error("Error:", error));
    }

    function clearModal() {
        document.getElementById("customerId").value = '';
        document.getElementById("name").value = '';
        document.getElementById("surname").value = '';
        document.getElementById("email").value = '';
        document.getElementById("phone").value = '';
    }

    window.onload = function () {
        getAllCustomers();
    };
</script>

</body>
</html>
