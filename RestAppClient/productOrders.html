<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Order Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="customer.html">Customers</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="orders.html">Orders</a>
                <a class="nav-link active" href="productOrders.html">Product-Orders</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Product Order Management</h2>
    <hr>

    <div class="row">
        <div class="col-md-12">
            <div class="row">
                <h4 class="col-md-10">Product Order List</h4>
                <button class="btn btn-sm btn-primary col-md-2" data-bs-toggle="modal"
                        data-bs-target="#addProductOrderModal" onclick="clearModal()">Add Product Order
                </button>
            </div>
            <table id="productOrderTable" class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="productOrderList">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addProductOrderModal" tabindex="-1" aria-labelledby="addProductOrderModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addProductOrderModalLabel">Add/Edit Product Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="productOrderForm">
                    <div class="form-group">
                        <input type="hidden" id="productOrderId">
                        <label for="order">Order:</label>
                        <select class="form-control" id="order" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product">Product:</label>
                        <select class="form-control" id="product" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" class="form-control" id="quantity" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2" id="saveProductOrderBtn">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
    function getAllProductOrders() {
        fetch("http://localhost:9090/getAllOrderProducts")
            .then(response => response.json())
            .then(data => {
                const productOrderTable = document.getElementById("productOrderList");
                productOrderTable.innerHTML = "";
                data.forEach(productOrder => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${productOrder.id}</td>
                        <td>${productOrder.order.id}, ${productOrder.order.customer.name} ${productOrder.order.customer.surname}</td>
                        <td>${productOrder.product.name}</td>
                        <td>${productOrder.quantity}</td>
                        <td>$${productOrder.totalPrice}</td>

                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editProductOrder(${productOrder.id})" data-bs-toggle="modal" data-bs-target="#addProductOrderModal">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProductOrder(${productOrder.id})">Delete</button>
                        </td>
                    `;
                    productOrderTable.appendChild(row);
                });
            })
            .catch(error => {
                console.error("Error:", error);
                const productOrderTable = document.getElementById("productOrderList");
                productOrderTable.innerHTML = "<tr><td colspan='6'>No product orders found.</td></tr>";
            });
    }

    async function calculateTotalPrice(productId, quantity) {
        try {
            const response = await fetch(`http://localhost:9090/getProductById/${productId}`);
            const data = await response.json();
            const price = data.price;
            return price * quantity;
        } catch (error) {
            console.error("Error:", error);
            return null;
        }
    }


    function populateOrdersAndProductsSelectBoxes() {
        fetch("http://localhost:9090/getAllOrders")
            .then(response => response.json())
            .then(data => {
                const orderSelect = document.getElementById("order");
                orderSelect.innerHTML = "";
                data.forEach(order => {
                    const option = document.createElement("option");
                    option.value = order.id;
                    option.textContent = `Order ID: ${order.id}, Customer: ${order.customer.name} ${order.customer.surname}`;
                    orderSelect.appendChild(option);
                });
            })
            .catch(error => console.error("Error:", error));

        fetch("http://localhost:9090/getAllProducts")
            .then(response => response.json())
            .then(data => {
                const productSelect = document.getElementById("product");
                productSelect.innerHTML = "";
                data.forEach(product => {
                    const option = document.createElement("option");
                    option.value = product.id;
                    option.textContent = `Product ID: ${product.id}, ${product.name}`;
                    productSelect.appendChild(option);
                });
            })
            .catch(error => console.error("Error:", error));
    }

    function editProductOrder(id) {
        fetch(`http://localhost:9090/getOrderProductById/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("productOrderId").value = data.id;
                document.getElementById("order").value = data.order.id;
                document.getElementById("product").value = data.product.id;
                document.getElementById("quantity").value = data.quantity;
            })
            .catch(error => console.log("Error:", error));
    }

    document.getElementById("productOrderForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        const id = document.getElementById("productOrderId").value;
        const orderId = document.getElementById("order").value;
        const productId = document.getElementById("product").value;
        const quantity = document.getElementById("quantity").value;
        const totalPrice = await calculateTotalPrice(productId, quantity);
        const productOrder = {
            id: id,
            order: {id: orderId},
            product: {id: productId},
            quantity: quantity,
            totalPrice: totalPrice
        };
        console.log(productOrder)

        fetch("http://localhost:9090/createOrderProduct", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(productOrder)
        })
            .then(() => {
                getAllProductOrders();
                document.getElementById("productOrderId").value = '';
                document.getElementById("order").value = '';
                document.getElementById("product").value = '';
                document.getElementById("quantity").value = '';
            })
            .catch(error => console.log("Error:", error));
    });

    function deleteProductOrder(id) {
        fetch(`http://localhost:9090/deleteOrderProductById/${id}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(() => {
                console.log("Product order deleted successfully");
                getAllProductOrders();
            })
            .catch(error => console.log("Error:", error));
    }

    function clearModal() {
        document.getElementById("productOrderId").value = '';
        document.getElementById("order").value = '';
        document.getElementById("product").value = '';
        document.getElementById("quantity").value = '';
    }

    window.onload = function () {
        getAllProductOrders();
        populateOrdersAndProductsSelectBoxes();
    };
</script>

</body>
</html>
