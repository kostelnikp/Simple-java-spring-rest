<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="customer.html">Customers</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link active" href="orders.html">Orders</a>
                <a class="nav-link" href="productOrders.html">Product-Orders</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Order Management</h2>
    <hr>

    <div class="row">
        <div class="col-md-12">
            <div class="row">
                <h4 class="col-md-10">Order List</h4>
                <button class="btn btn-sm btn-primary col-md-2" data-bs-toggle="modal"
                        data-bs-target="#addOrderModal" onclick="clearModal()">Add Order
                </button>
            </div>
            <table id="orderTable" class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Customer</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="orderList">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addOrderModal" tabindex="-1" aria-labelledby="addOrderModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addOrderModalLabel">Add/Edit Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="orderForm">
                    <div class="form-group">
                        <input type="hidden" id="orderId">
                        <label for="orderDate">Order Date:</label>
                        <input type="date" class="form-control" id="orderDate" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <input type="text" class="form-control" id="status" required>
                    </div>
                    <div class="form-group">
                        <label for="customer">Customer:</label>
                        <select class="form-control" id="customer" required>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2" id="saveOrderBtn">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
    function getAllOrders() {
        fetch("http://localhost:9090/getAllOrders")
            .then(response => response.json())
            .then(data => {
                const orderTable = document.getElementById("orderList");
                orderTable.innerHTML = "";
                data.forEach(order => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${order.id}</td>
                        <td>${order.orderDate}</td>
                        <td>$${order.totalAmount}</td>
                        <td>${order.status}</td>
                        <td>${order.customer.name} ${order.customer.surname}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editOrder(${order.id})" data-bs-toggle="modal" data-bs-target="#addOrderModal">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteOrder(${order.id})">Delete</button>
                        </td>
                    `;
                    orderTable.appendChild(row);
                });
            })
            .catch(error => {
                console.error("Error:", error);
                const orderTable = document.getElementById("orderList");
                orderTable.innerHTML = "<tr><td colspan='6'>No orders found.</td></tr>";
            });
    }

    function populateCustomersSelectBox() {
        fetch("http://localhost:9090/getAllCustomers")
            .then(response => response.json())
            .then(data => {
                const customerSelect = document.getElementById("customer");
                customerSelect.innerHTML = "";
                data.forEach(customer => {
                    const option = document.createElement("option");
                    option.value = customer.id;
                    option.textContent = `${customer.name} ${customer.surname}`;
                    customerSelect.appendChild(option);
                });
            })
            .catch(error => console.error("Error:", error));
    }

    function editOrder(id) {
        fetch(`http://localhost:9090/getOrderById/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("orderId").value = data.id;
                document.getElementById("orderDate").value = data.orderDate;
                document.getElementById("status").value = data.status;
                document.getElementById("customer").value = data.customer.id;
            })
            .catch(error => console.log("Error:", error));
    }

    document.getElementById("orderForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const id = document.getElementById("orderId").value;
        const orderDate = document.getElementById("orderDate").value;
        const status = document.getElementById("status").value;
        const customer = document.getElementById("customer").value;
        const order = {id: id, orderDate: orderDate, totalAmount: 0, status: status, customer: {id: customer}};
        console.log(JSON.stringify(order));

        fetch("http://localhost:9090/createOrder", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(order)
        })
            .then(() => {
                getAllOrders();
                document.getElementById("orderId").value = '';
                document.getElementById("orderDate").value = '';
                document.getElementById("status").value = '';
            })
            .catch(error => console.log("Error:", error));
    });

    function deleteOrder(id) {
        fetch(`http://localhost:9090/deleteOrderById/${id}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(() => {
                console.log("Order deleted successfully");
                getAllOrders();
            })
            .catch(error => console.log("Error:", error));
    }

    function clearModal() {
        document.getElementById("orderDate").value = '';
        document.getElementById("status").value = '';
        document.getElementById("customer").value = '';
    }

    window.onload = function () {
        getAllOrders();
        populateCustomersSelectBox();
    };
</script>

</body>
</html>
